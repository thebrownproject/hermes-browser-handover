name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Synthetic browser and lifecycle tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Use runner Chrome
        run: echo "HBH_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check committed whitespace
        run: git show --format= --check HEAD
      - name: Run synthetic browser, auth and lifecycle tests
        working-directory: tests
        run: python -W ignore -m unittest test_units test_viewer test_browser_ui test_regressions -v
      - name: Install pinned WebKit acceptance engine
        run: |
          npm install --prefix "$RUNNER_TEMP/hbh-webkit" --ignore-scripts playwright-core@1.60.0
          node "$RUNNER_TEMP/hbh-webkit/node_modules/playwright-core/cli.js" install --with-deps webkit
      - name: WebKit touch gestures and themes
        working-directory: tests
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/hbh-webkit/node_modules/playwright-core
        run: python -W ignore -m unittest test_webkit_ui -v
