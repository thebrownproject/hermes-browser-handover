name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Synthetic browser and lifecycle tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Use runner Chrome
        run: echo "HBH_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check committed whitespace
        run: git show --format= --check HEAD
      - name: Run synthetic browser, auth and lifecycle tests
        working-directory: tests
        run: python -W ignore -m unittest test_units test_viewer test_browser_ui test_regressions -v
